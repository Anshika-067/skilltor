<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas_Game</title>
    <link rel="stylesheet" href="st.css">
    
    
</head>

<body>
    
    <main id="game-container"> <!--Main Game Canvas Container-->
        <canvas id="game-canvas"></canvas> <!--Main Game World Canva-->
        <div id="ui-layer"> <!--Heads Up Display (HUD) and UI Overlays-->
            <div id="stats-overlay"> <!--Player Stats display-->
                <div id="health-container">
                    <span>HP:</span>
                    <div id="health-bar-bag">
                        <div id="health-bar-fill"></div>
                    </div>
                </div>

                <div id="score-container">
                    <span>Score:
                        <span id="score-value">0</span>
                    </span>
                </div>
            </div>

            <div id="minimap-container"> <!--Minimap Conatainer-->
                <canvas id="minimap-canvas"></canvas>
            </div>

            <div id="start-screen " class="menu-overlay"> <!--Start/Over Menu-->
                <h1>Top-Down Adventure</h1>
                <button id="start-btn">Play Game</button>
            </div>

            <div id="game-over-screen" class="menu-overlay hidden">
                <h1>Game Over</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">Try Again</button>
            </div>
        </div>

    </main>
<script src="game.js"></script>
</body>

</html>
